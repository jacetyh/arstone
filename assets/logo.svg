<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="100%" height="100%" role="img" aria-label="ARstone Logo">
  <defs>
    <!-- Gradienty dla faset kamienia / sygnetu -->
    <linearGradient id="facetPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="facetAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="textGradAr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Filtr subtelnego cienia / poświaty -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Sygnet: Stylizowany geometryczny kryształ / szlifowany kamień łączący motyw A & R -->
    <g class="symbol" transform="translate(10, 0)">
      <!-- Faseta bazowa (tył) -->
      <polygon points="60,10 110,45 100,105 50,115 15,75 25,25" fill="url(#facetDark)" stroke="#334155" stroke-width="1.5" />

      <!-- Lewe skrzydło (kształt litery A) -->
      <polygon points="60,10 25,25 15,75 55,65" fill="url(#facetPrimary)" opacity="0.95" />
      
      <!-- Środkowy szlif boczny -->
      <polygon points="60,10 55,65 75,55 90,28" fill="url(#facetLight)" opacity="0.85" />

      <!-- Prawe ramię (brzuch litery R) -->
      <polygon points="60,10 90,28 110,45 80,68 65,55" fill="url(#facetAccent)" opacity="0.9" />

      <!-- Dolna noga litery R / podstawa kamienia -->
      <polygon points="65,55 80,68 100,105 68,90 55,65" fill="url(#facetPrimary)" opacity="0.85" />

      <!-- Dolna płaszczyzna cokołu -->
      <polygon points="55,65 68,90 50,115 15,75" fill="url(#facetAccent)" opacity="0.75" />

      <!-- Centralne podświetlenie / krawędzie geometryczne -->
      <line x1="60" y1="10" x2="55" y2="65" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
      <line x1="55" y1="65" x2="100" y2="105" stroke="#93c5fd" stroke-width="1.2" opacity="0.5" />
      <line x1="55" y1="65" x2="50" y2="115" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Logotyp: AR + STONE -->
    <!-- Litery AR -->
    <text x="160" y="82" font-family="'Outfit', 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="1" fill="url(#textGradAr)">
      AR
    </text>

    <!-- Litery STONE -->
    <text x="268" y="82" font-family="'Outfit', 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif" font-size="64" font-weight="300" letter-spacing="8" fill="#f8fafc">
      STONE
    </text>

    <!-- Podpis / Slogan (opcjonalny, elegancki) -->
    <text x="272" y="106" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="6" fill="#94a3b8" text-transform="uppercase">
      ARCHITECTURAL SURFACES &amp; DESIGN
    </text>
  </g>
</svg>
