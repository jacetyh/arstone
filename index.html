<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARstone — Oficjalne Logo</title>
  
  <!-- SEO & Social Media Meta Tags -->
  <meta name="description" content="Oficjalna prezentacja logo ARstone przygotowana dla GitHub Pages.">
  <meta property="og:title" content="ARstone — Logo">
  <meta property="og:description" content="Nowoczesna strona prezentacyjna marki ARstone.">
  <meta property="og:image" content="./assets/logo.svg">
  <meta property="og:type" content="website">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- Style CSS -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Tło dekoracyjne -->
  <div class="bg-decor" aria-hidden="true"></div>

  <div class="container">
    <!-- Górny pasek -->
    <header>
      <div class="brand-badge">
        <span style="display:inline-block; width:8px; height:8px; background:#38bdf8; border-radius:50%; box-shadow:0 0 8px #38bdf8;"></span>
        GitHub Pages
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Zmień motyw">
        <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span id="themeText">Motyw</span>
      </button>
    </header>

    <!-- Główna część prezentacyjna -->
    <main>
      <section class="logo-card">
        <!-- 
          WSKAZÓWKA: Aby podmienić logo na własny plik graficzny (np. PNG, WebP lub inny SVG):
          Wystarczy skopiować swój plik do katalogu assets/ (np. assets/moje-logo.png)
          i zmienić poniższą ścieżkę w atrybucie src.
        -->
        <div class="logo-display">
          <img src="./assets/logo.svg" alt="ARstone Logo" class="logo-image" id="arstoneLogo">
        </div>

        <p class="logo-description">
          Nowoczesna identyfikacja wizualna marki ARstone łącząca precyzję architektury z naturalnym pięknem kamienia.
        </p>

        <!-- Akcje pobierania i podglądu -->
        <div class="actions">
          <a href="./assets/logo.svg" download="ARstone-Logo.svg" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Pobierz SVG
          </a>
          <button type="button" class="btn btn-secondary" id="downloadPngBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            Eksportuj PNG
          </button>
        </div>
      </section>
    </main>

    <!-- Stopka -->
    <footer>
      <p>&copy; <span id="year"></span> <strong>ARstone</strong> &bull; Hostowane na <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">GitHub Pages</a></p>
    </footer>
  </div>

  <!-- Skrypt pomocniczy: Dark/Light Mode + Eksport PNG -->
  <script>
    // Aktualny rok w stopce
    document.getElementById('year').textContent = new Date().getFullYear();

    // Obsługa motywu Dark / Light
    const toggleBtn = document.getElementById('themeToggle');
    const themeText = document.getElementById('themeText');
    const root = document.documentElement;

    const savedTheme = localStorage.getItem('arstone-theme') || 'dark';
    setTheme(savedTheme);

    toggleBtn.addEventListener('click', () => {
      const currentTheme = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      setTheme(newTheme);
      localStorage.setItem('arstone-theme', newTheme);
    });

    function setTheme(theme) {
      if (theme === 'light') {
        root.setAttribute('data-theme', 'light');
        themeText.textContent = 'Ciemny';
      } else {
        root.removeAttribute('data-theme');
        themeText.textContent = 'Jasny';
      }
    }

    // Eksport SVG do PNG wysokiej rozdzielczości
    document.getElementById('downloadPngBtn').addEventListener('click', () => {
      const img = document.getElementById('arstoneLogo');
      const canvas = document.createElement('canvas');
      const scale = 3; // Wysoka jakość Retina/3x
      canvas.width = 620 * scale;
      canvas.height = 140 * scale;
      const ctx = canvas.getContext('2d');
      
      const tempImg = new Image();
      tempImg.crossOrigin = 'anonymous';
      tempImg.onload = () => {
        ctx.scale(scale, scale);
        ctx.drawImage(tempImg, 0, 0, 620, 140);
        const a = document.createElement('a');
        a.download = 'ARstone-Logo.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      tempImg.src = img.src;
    });
  </script>
</body>
</html>
