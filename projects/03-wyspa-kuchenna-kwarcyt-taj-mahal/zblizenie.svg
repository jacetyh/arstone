<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_03-wyspa-kuchenna-kwarcyt-taj-mahal_zblizenie_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#grad_03-wyspa-kuchenna-kwarcyt-taj-mahal_zblizenie_svg)" />
  
  <!-- Użylenie kamienia / wzór graficzny -->
  <g opacity="0.35" stroke="#ca8a04" stroke-width="2.5" fill="none">
    <path d="M-100,200 Q300,100 600,450 T1300,300" />
    <path d="M-50,550 Q450,400 800,650 T1350,500" stroke-width="1.5" />
    <path d="M200,-50 Q400,350 750,200 T1100,850" stroke-width="3" opacity="0.5" />
  </g>

  <!-- Wizualizacja blatu kamiennego -->
  <g transform="translate(150, 180)" filter="url(#shadow)">
    <!-- Płyta blatu 3D -->
    <polygon points="100,280 800,280 880,180 180,180" fill="#fafaf9" stroke="#ca8a04" stroke-width="2" />
    <!-- Czoło blatu -->
    <polygon points="100,280 800,280 800,340 100,340" fill="#f5f5f4" stroke="#ca8a04" stroke-width="1.5" />
    <!-- Boczna faza -->
    <polygon points="800,280 880,180 880,240 800,340" fill="#fafaf9" opacity="0.7" />
    
    <!-- Odbłysk poleru -->
    <line x1="220" y1="200" x2="750" y2="260" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Etykieta zdjęcia -->
  <rect x="80" y="680" width="1040" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" />
  <text x="120" y="725" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="600">
    Wyspa Kuchenna — Naturalny Kwarcyt Taj Mahal &bull; Podświetlenie krawędzi LED
  </text>
  <text x="1080" y="725" fill="#ca8a04" text-anchor="end" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">
    ARstone
  </text>
</svg>